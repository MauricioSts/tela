# coturn — TURN mínimo, credenciais estáticas, só UDP (foco em latência).
# Substitua 147.15.7.227 e a senha antes de subir.

listening-port=3478
listening-ip=0.0.0.0

# CRÍTICO na OCI: a VM está atrás de NAT 1:1, o IP público NÃO está na
# interface. Sem external-ip o candidato relay sai com IP privado e nada conecta.
external-ip=147.15.7.227

# Autenticação long-term com usuário/senha fixos.
lt-cred-mech
user=telauser:__TURN_PASSWORD__
realm=tela.mauriciosts.com

# Faixa de portas de relay (precisa estar aberta no iptables e na Security List).
min-port=49160
max-port=49200

# Não precisamos de TLS/DTLS: TURN é só fallback UDP.
no-tls
no-dtls

fingerprint
no-cli
# Uso pessoal 1:1; não repassar pra multicast/loopback.
no-multicast-peers
