# Compila o app de desktop no Windows e publica o instalador no Releases.
# Roda sozinho quando você empurra uma tag v* (ex.: v0.1.1) — tem que ser a MESMA
# tag que o electron-builder usa pra publicar, que é sempre v<version> do
# package.json. No botão "Run workflow" ele só compila e deixa o .exe como artifact.
name: MIMO desktop (Windows)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write          # necessário pra criar o Release

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Empacotar (e publicar, se for tag)
        shell: bash
        # o log da execução só é legível por quem tem admin do repo; o ::error::
        # vira annotation, que a API pública mostra — é assim que se enxerga a falha
        run: |
          set -o pipefail
          npx electron-builder --win --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }} 2>&1 | tee build.log || {
            echo "::error::electron-builder falhou: $(tail -c 1200 build.log | tr '\n\r' '  ')"
            exit 1
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: MIMO-setup
          path: desktop/dist/*.exe
          if-no-files-found: error
